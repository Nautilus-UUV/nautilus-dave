[pytest]
# Marker registry mirrors py_pkg's. `sim` gates Tier 3 tests that need
# dave_robot_models artifacts (templates, canonical SDFs) installed —
# they don't actually spin up Gazebo but they depend on sim-side share
# dirs, so they stay out of any non-sim test run. The sim_models /
# sweep_watchdog tests are plain Tier 1/2 and run by default.
markers =
    sim: Tier 3 — depends on sim-side artifacts (SDFs, templates, dave_robot_models share). Opt in with: pytest -m sim test/

addopts = -m "not sim"

# Only collect from the test tree (same guard as py_pkg's pytest.ini):
# without this, a bare `pytest` from the package root also recurses into
# the source `nautilus_hal/` package and colcon's `build/`/`install/`
# staging, importing stale copies at collection time.
testpaths = test
norecursedirs = build install log .git __pycache__ *.egg-info
